name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          rm -rf DigiHRMobile.xcodeproj
          xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project DigiHRMobile.xcodeproj \
            -scheme DigiHRMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/DigiHRMobile.app
          test -d "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry DigiHRMobile-unsigned.ipa Payload
          ls -lh DigiHRMobile-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DigiHRMobile-unsigned-ipa
          path: out/DigiHRMobile-unsigned.ipa
